name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    # Windows catches POSIX-only assumptions: cp1252 default encoding,
    # backslash paths, npm.cmd shims (see #15).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Fail on any text-mode open() without an explicit encoding (PEP 597).
      PYTHONWARNDEFAULTENCODING: "1"
      PYTHONWARNINGS: error::EncodingWarning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: python3 resolves to the setup-python interpreter
        run: python3 -c "import sys; print(sys.executable, sys.version)"

      - name: Setup helper launches npm (resolves npm.cmd on Windows)
        run: |
          python3 -c "
          import importlib.util as u
          s = u.spec_from_file_location('install', 'skills/setup/install.py')
          m = u.module_from_spec(s); s.loader.exec_module(m)
          code, out, err = m.run(['npm', '--version'])
          assert code == 0 and out, (code, out, err)
          print('npm', out)
          "

      - name: Installed hook command runs through bash
        run: |
          python3 -c "
          import importlib.util as u, os, shutil, subprocess, tempfile
          s = u.spec_from_file_location('install', 'skills/setup/install.py')
          m = u.module_from_spec(s); s.loader.exec_module(m)
          cmd = m.HOOK_COMMAND.removesuffix(' || true')
          assert os.name != 'nt' or not cmd.startswith('python3'), cmd
          # Copy into a folder with a space to exercise the quoting.
          src = os.path.join(tempfile.mkdtemp(), 'a b', 'pulse-capture.py')
          os.makedirs(os.path.dirname(src)); shutil.copy('skills/setup/capture.py', src)
          src = src.replace(os.sep, '/')
          # Windows command quotes the path; POSIX uses ~, which bash expands safely.
          cmd = cmd.replace(m.HOOK_DEST.replace(os.sep, '/'), src)
          cmd = cmd.replace('~/.claude/hooks/pulse-capture.py', f'\"{src}\"')
          home = tempfile.mkdtemp()
          r = subprocess.run([shutil.which('bash') or 'bash', '-c', cmd], input='{}', text=True, encoding='utf-8',
                             env={**os.environ, 'HOME': home, 'USERPROFILE': home})
          assert r.returncode == 0, (cmd, r.returncode)
          print('ok:', cmd)
          "

      - name: Compile all scripts
        run: python3 -m py_compile skills/setup/*.py skills/digest/*.py skills/synth/*.py

      - name: Capture parser and redaction tests
        run: python3 skills/setup/test_capture.py

      - name: Daily note structure, open loops, label folding tests
        run: python3 skills/digest/test_digest.py

      - name: Link-rendering rule (existence-based)
        run: |
          set -e
          mkdir -p /tmp/v/Pulse/Projects
          # No project note yet -> bold
          out=$(printf -- '- x' | python3 skills/digest/digest.py render-block --project Demo --projects-dir /tmp/v/Pulse/Projects)
          echo "$out" | grep -q '### \*\*Demo\*\*'
          # Create the project note -> wikilink
          echo '# Demo' > /tmp/v/Pulse/Projects/Demo.md
          out=$(printf -- '- x' | python3 skills/digest/digest.py render-block --project Demo --projects-dir /tmp/v/Pulse/Projects)
          echo "$out" | grep -q '### \[\[Demo\]\]'

      - name: Non-ASCII survives piped stdio on a cp1252 console
        run: |
          set -e
          mkdir -p /tmp/u/Pulse/Projects
          out=$(printf -- '- fixed \xe2\x80\x9cdone\xe2\x80\x9d' | PYTHONIOENCODING=cp1252 python3 skills/digest/digest.py render-block --project Demo --projects-dir /tmp/u/Pulse/Projects)
          echo "$out" | grep -q "$(printf 'fixed \xe2\x80\x9cdone\xe2\x80\x9d')"

      - name: Month-hub + index wiring is idempotent and graph is whole
        run: |
          set -e
          mkdir -p /tmp/g/Pulse/Daily/2026-06
          printf -- '---\ndate: "2026-06-15"\ntags: [pulse, daily]\nprojects:\n  - "demo"\n---\n\n# Mon, June 15, 2026\n\n## Summary\n\nDid work.\n\n## Work log\n\n### **demo**\n\n- Outcome: x.py exists now.\n- Built `x.py`\n\n## Open loops\n\n- None.\n' > /tmp/g/Pulse/Daily/2026-06/2026-06-15.md
          python3 skills/digest/digest.py month-links --vault /tmp/g --subfolder "Pulse/Daily" --date 2026-06-15 --hub-prefix Pulse --index "Pulse Index.md"
          python3 skills/digest/digest.py month-links --vault /tmp/g --subfolder "Pulse/Daily" --date 2026-06-15 --hub-prefix Pulse --index "Pulse Index.md"
          python3 skills/digest/digest.py lint /tmp/g/Pulse/Daily/2026-06/2026-06-15.md
          python3 skills/digest/digest.py check-links --vault /tmp/g

      - name: Gates reject a bad note (em dash, dead link)
        run: |
          set -e
          printf -- '---\nx: 1\n---\n\n# H\n\n## Summary\n\nThis is very good — yeah.\n\n## Work log\n\n### x\n' > /tmp/bad.md
          if python3 skills/digest/digest.py lint /tmp/bad.md; then echo "lint should have failed"; exit 1; fi
          mkdir -p /tmp/dead/Pulse
          printf -- '# A\n[[Missing]]\n' > /tmp/dead/Pulse/a.md
          if python3 skills/digest/digest.py check-links --vault /tmp/dead; then echo "check_links should have failed"; exit 1; fi

      - name: Synth collects a week and buckets by project (existence-based linking)
        run: |
          set -e
          export NOTES_REPO=/tmp/n
          mkdir -p /tmp/n/Pulse/Daily/2026-06 /tmp/n/Pulse/Projects
          printf -- '---\ndate: "2026-06-08"\ntags: [pulse, daily]\n---\n\n# Mon, June 8, 2026\n\n## Summary\n\nShipped the faster home page.\n\n## Work log\n\n### [[Web App]]\n\n- Cut home page load to 1s\n\n### **Notifications**\n\n- Fixed dropped alerts\n' > /tmp/n/Pulse/Daily/2026-06/2026-06-08.md
          printf -- '---\ndate: "2026-06-10"\ntags: [pulse, daily]\n---\n\n# Wed, June 10, 2026\n\n## Summary\n\nMore on the web app.\n\n## Work log\n\n### **Web App**\n\n- Added preview button\n' > /tmp/n/Pulse/Daily/2026-06/2026-06-10.md
          printf -- '# Web App\n' > "/tmp/n/Pulse/Projects/Web App.md"
          python3 skills/synth/synth.py collect --week-end 2026-06-14 > /tmp/week.json
          python3 -c "import json,sys;d=json.load(open(sys.argv[1],encoding='utf-8'));assert d['note_count']==2,d;assert d['week_start']=='2026-06-08',d;assert d['weekly_hub_prefix']=='Pulse Weekly',d" /tmp/week.json
          python3 skills/synth/synth.py buckets /tmp/week.json > /tmp/buckets.json
          python3 -c "import json,sys;b=json.load(open(sys.argv[1],encoding='utf-8'))['buckets'];assert b['Web App']['rendered']=='[[Web App]]',b;assert b['Web App']['days']==['2026-06-08','2026-06-10'],b;assert b['Notifications']['rendered']=='**Notifications**',b" /tmp/buckets.json

      - name: Synth week-links is idempotent and the graph stays whole
        run: |
          set -e
          mkdir -p /tmp/w/Pulse/Weekly/2026-06 /tmp/w/Pulse/Daily/2026-06
          printf -- '---\ndate: "2026-06-08"\ntags: [pulse, daily]\n---\n\n# Mon, June 8, 2026\n' > /tmp/w/Pulse/Daily/2026-06/2026-06-08.md
          printf -- '---\ntype: weekly\nweek_start: "2026-06-08"\nweek_end: "2026-06-14"\ntags: [pulse, weekly]\n---\n\n# Week of Jun 8 to Jun 14, 2026\n\nGood week.\n\n## What you worked on\n\n- **Web App** (2 days): shipped a faster home page\n\n## Sources\n\nDaily notes read: [[Pulse/Daily/2026-06/2026-06-08|Jun 8]]\n' > /tmp/w/Pulse/Weekly/2026-06/2026-06-14.md
          python3 skills/synth/synth.py week-links --vault /tmp/w --subfolder "Pulse/Weekly" --date 2026-06-14 --hub-prefix "Pulse Weekly" --index "Pulse Weekly Index.md"
          python3 skills/synth/synth.py week-links --vault /tmp/w --subfolder "Pulse/Weekly" --date 2026-06-14 --hub-prefix "Pulse Weekly" --index "Pulse Weekly Index.md"
          python3 skills/synth/synth.py lint /tmp/w/Pulse/Weekly/2026-06/2026-06-14.md
          python3 skills/digest/digest.py check-links --vault /tmp/w --subfolder Pulse

      - name: Synth gates reject a bad note and a dropped project
        run: |
          set -e
          printf -- '---\nx: 1\n---\n\n# Week of Jun 8 to Jun 14, 2026\n\nGood — yeah.\n\n## What you worked on\n\n- **Web App** (2 days): x\n\n## Sources\n\nx\n' > /tmp/badweek.md
          if python3 skills/synth/synth.py lint /tmp/badweek.md; then echo "lint should have failed (em dash)"; exit 1; fi
          printf '%s' '{"buckets":{"Web App":{},"Notifications":{}}}' > /tmp/bkts.json
          printf -- '---\nx: 1\n---\n\n# Week\n\n## What you worked on\n\n- Web App\n\n## Sources\n\nx\n' > /tmp/wk.md
          if python3 skills/synth/synth.py coverage --buckets /tmp/bkts.json --weekly-note /tmp/wk.md; then echo "coverage should have failed (dropped Notifications)"; exit 1; fi
          printf -- '---\nx: 1\n---\n\n# Week\n\n## What you worked on\n\n- Web App\n\n## What I skipped (and why)\n\n- Notifications: one quiet mention\n\n## Sources\n\nx\n' > /tmp/wk2.md
          python3 skills/synth/synth.py coverage --buckets /tmp/bkts.json --weekly-note /tmp/wk2.md
          # A label must not be counted present as a substring inside a longer word.
          printf '%s' '{"buckets":{"Auth":{},"Authentication":{}}}' > /tmp/bkts2.json
          printf -- '---\nx: 1\n---\n\n# Week\n\n## What you worked on\n\n- **Authentication** (2 days): x\n\n## Sources\n\nx\n' > /tmp/wk3.md
          if python3 skills/synth/synth.py coverage --buckets /tmp/bkts2.json --weekly-note /tmp/wk3.md; then echo "coverage should have failed (Auth is only a substring of Authentication)"; exit 1; fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
